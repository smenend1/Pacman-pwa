<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Maze Chase</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif;height:100%;overflow:hidden}
body{display:flex;justify-content:center;align-items:center}
#app{width:min(96vw,620px);text-align:center}
h1{margin:4px 0 6px;color:#ffe900;font-size:clamp(22px,6vw,34px);letter-spacing:2px}
#hud{display:flex;justify-content:space-between;font-weight:bold;font-size:14px;margin:0 4px 7px}
#game{display:block;width:100%;aspect-ratio:1/1;background:#000;border:3px solid #155cff;border-radius:10px;box-shadow:0 0 18px #084fff88}
#controls{margin:10px auto 0;width:190px;display:grid;grid-template-columns:repeat(3,58px);gap:5px;justify-content:center}
button{height:48px;border:1px solid #2d6cff;border-radius:12px;background:#101832;color:#fff;font-size:23px;font-weight:bold;touch-action:none}
button:active{background:#234b9c}
#up{grid-column:2}#left{grid-column:1}#down{grid-column:2}#right{grid-column:3}
#msg{height:22px;margin-top:5px;color:#ffd900;font-size:13px}
</style>
</head>
<body>
<div id="app">
<h1>MAZE CHASE</h1>
<div id="hud"><span>PUNTOS: <b id="score">0</b></span><span>VIDAS: <b id="lives">3</b></span><span>NIVEL: <b id="level">1</b></span></div>
<canvas id="game" width="560" height="560"></canvas>
<div id="controls">
<button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button>
</div>
<div id="msg">Come todos los puntos. Evita a los fantasmas.</div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const N=21, cell=c.width/N;
const raw=[
"#####################",
"#.........#.........#",
"#.###.###.#.###.###.#",
"#o###.###.#.###.###o#",
"#...................#",
"#.###.#.#######.#.###",
"#.....#....#....#....#",
"#####.####.#.####.###",
"#.........   .......#",
"#.###.###   ###.###.#",
"    #.#   P   #.#    ",
"#.###.###   ###.###.#",
"#.........   .......#",
"###.####.###.####.###",
"#....#....#....#....#",
"#.##.#.##.#.##.#.##.#",
"#o.................o#",
"#.###.###.#.###.###.#",
"#...................#",
"#.........#.........#",
"#####################"
];
// Convert variable spaces into walls/open area consistently.
let map=raw.map(r=>r.padEnd(N,'#').slice(0,N).split(''));
const open=(x,y)=>x>=0&&x<N&&y>=0&&y<N&&map[y][x]!=='#';
let score=0,lives=3,level=1,paused=false;
let player={x:10,y:10,dx:0,dy:0,nextX:0,nextY:0,mouth:0};
let ghosts=[
{x:9,y:10,dx:1,dy:0,color:'#ff3030'},
{x:11,y:10,dx:-1,dy:0,color:'#ff75d4'},
{x:10,y:9,dx:0,dy:-1,color:'#27e8ff'},
{x:10,y:11,dx:0,dy:1,color:'#ff9f20'}
];
let dots=new Set(), power=new Set();
for(let y=0;y<N;y++)for(let x=0;x<N;x++){
 if(map[y][x]==='.')dots.add(x+','+y);
 if(map[y][x]==='o')power.add(x+','+y);
 if(map[y][x]==='P')map[y][x]=' ';
}
function drawMaze(){
 ctx.clearRect(0,0,c.width,c.height);
 ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  if(map[y][x]==='#'){
   ctx.strokeStyle='#145cff';ctx.lineWidth=3;
   ctx.strokeRect(x*cell+2,y*cell+2,cell-4,cell-4);
  }
 }
 ctx.fillStyle='#ffe900';
 dots.forEach(k=>{let [x,y]=k.split(',').map(Number);ctx.beginPath();ctx.arc(x*cell+cell/2,y*cell+cell/2,2.7,0,7);ctx.fill()});
 ctx.fillStyle='#fff';power.forEach(k=>{let [x,y]=k.split(',').map(Number);ctx.beginPath();ctx.arc(x*cell+cell/2,y*cell+cell/2,7,0,7);ctx.fill()});
}
function drawPac(){
 let x=player.x*cell+cell/2,y=player.y*cell+cell/2;
 let a=Math.atan2(player.dy,player.dx); if(player.dx===0&&player.dy===0)a=0;
 let m=Math.abs(Math.sin(player.mouth))*0.22;
 ctx.fillStyle='#ffe900';ctx.beginPath();
 ctx.moveTo(x,y);ctx.arc(x,y,cell*.39,a+m,a-m+Math.PI*2);ctx.closePath();ctx.fill();
}
function drawGhost(g){
 let x=g.x*cell+cell/2,y=g.y*cell+cell/2,r=cell*.36;
 ctx.fillStyle=g.color;ctx.beginPath();ctx.arc(x,y,r,Math.PI,0);ctx.lineTo(x+r,y+r);
 for(let i=0;i<4;i++){ctx.lineTo(x+r-(i+.5)*r/2,y+r-(i%2?3:0));}
 ctx.lineTo(x-r,y+r);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-r*.35,y-r*.15,r*.22,0,7);ctx.arc(x+r*.35,y-r*.15,r*.22,0,7);ctx.fill();
 ctx.fillStyle='#1748b5';ctx.beginPath();ctx.arc(x-r*.3,y-r*.13,r*.1,0,7);ctx.arc(x+r*.3,y-r*.13,r*.1,0,7);ctx.fill();
}
function canMove(x,y,dx,dy){return open(x+dx,y+dy)}
function chooseGhost(g){
 let opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>canMove(g.x,g.y,d[0],d[1]));
 if(opts.length>1)opts=opts.filter(d=>!(d[0]===-g.dx&&d[1]===-g.dy));
 if(!opts.length)return;
 // Chase sometimes, otherwise random.
 if(Math.random()<.65){
  opts.sort((a,b)=>Math.abs(g.x+a[0]-player.x)+Math.abs(g.y+a[1]-player.y) -
                    (Math.abs(g.x+b[0]-player.x)+Math.abs(g.y+b[1]-player.y)));
 }
 [g.dx,g.dy]=opts[Math.floor(Math.random()*(Math.random()<.7?Math.min(2,opts.length):opts.length))];
}
function step(){
 if(paused)return;
 player.mouth+=.35;
 if(canMove(player.x,player.y,player.nextX,player.nextY)){player.dx=player.nextX;player.dy=player.nextY}
 if(canMove(player.x,player.y,player.dx,player.dy)){player.x+=player.dx;player.y+=player.dy}
 let key=player.x+','+player.y;
 if(dots.delete(key)){score+=10}
 if(power.delete(key)){score+=50}
 ghosts.forEach(g=>{
  if(!canMove(g.x,g.y,g.dx,g.dy))chooseGhost(g);
  if(Math.random()<.22)chooseGhost(g);
  if(canMove(g.x,g.y,g.dx,g.dy)){g.x+=g.dx;g.y+=g.dy}
  if(g.x===player.x&&g.y===player.y){lives--;resetPlayer(); if(lives<=0){paused=true;document.getElementById('msg').textContent='GAME OVER — pulsa ENTER para reiniciar';}}
 });
 if(dots.size===0){level++;resetLevel()}
 document.getElementById('score').textContent=score;
 document.getElementById('lives').textContent=lives;
 document.getElementById('level').textContent=level;
}
function resetPlayer(){player={x:10,y:10,dx:0,dy:0,nextX:0,nextY:0,mouth:0}}
function resetLevel(){
 dots=new Set();power=new Set();
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(map[y][x]==='.')dots.add(x+','+y)}
 power.add('1,3');power.add('19,3');power.add('1,16');power.add('19,16');
 resetPlayer();ghosts.forEach((g,i)=>Object.assign(g,{x:10+(i%2?1:-1),y:10+(i<2?0:1),dx:i%2? -1:1,dy:0}));
}
function render(){drawMaze();drawPac();ghosts.forEach(drawGhost)}
function loop(){step();render();requestAnimationFrame(loop)}
function dir(dx,dy){player.nextX=dx;player.nextY=dy}
addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'||e.key==='w')dir(0,-1);
 if(e.key==='ArrowDown'||e.key==='s')dir(0,1);
 if(e.key==='ArrowLeft'||e.key==='a')dir(-1,0);
 if(e.key==='ArrowRight'||e.key==='d')dir(1,0);
 if(e.key==='Enter'&&paused){score=0;lives=3;level=1;paused=false;resetLevel();document.getElementById('msg').textContent='Come todos los puntos. Evita a los fantasmas.'}
});
[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]].forEach(([id,x,y])=>{
 let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();dir(x,y)});
});
resetLevel();loop();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
